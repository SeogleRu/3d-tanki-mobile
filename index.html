<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>3D Танки Mobile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }

    #canvas-container { display: block; }

    #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    .hud-text {
      position: absolute; color: #fff; text-shadow: 1px 1px 2px #000;
      padding: 4px 10px; background: rgba(0,0,0,.5); border-radius: 4px;
      font-size: 14px;
    }
    #score-display { top: 10px; left: 10px; }
    #health-display { top: 10px; right: 10px; }
    #help-msg { bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .7; max-width: 90vw; text-align: center; }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 34px; height: 34px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 6;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.7); }
    #crosshair::before { width: 34px; height: 2px; top: 16px; }
    #crosshair::after  { width: 2px; height: 34px; left: 16px; }

    /* Джойстик */
    #joystick-zone {
      position: absolute; left: 0; bottom: 0;
      width: 50%; height: 70%;
      z-index: 7; touch-action: none;
    }
    #joystick-base {
      position: absolute; width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.3);
      pointer-events: none; display: none; z-index: 8;
    }
    #joystick-knob {
      position: absolute; width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(46,204,113,.6);
      border: 2px solid rgba(255,255,255,.5);
      pointer-events: none; z-index: 9; display: none;
    }

    /* Зона обзора */
    #look-zone {
      position: absolute; right: 0; top: 0;
      width: 50%; height: 100%;
      z-index: 7; touch-action: none;
    }

    /* Кнопка стрельбы */
    #btn-shoot {
      position: absolute; right: 24px; bottom: 24px;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(231,76,60,.7);
      border: 2px solid rgba(255,255,255,.4);
      color: #fff; font-size: 28px;
      user-select: none; touch-action: manipulation;
      z-index: 10; cursor: pointer;
    }
    #btn-shoot:active { background: rgba(231,76,60,.95); transform: scale(.93); }

    #pc-hint {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-size: 16px; text-align: center;
      background: rgba(0,0,0,.75); padding: 20px 28px; border-radius: 8px;
      z-index: 20; display: none;
    }
  </style>
</head>
<body>
  <audio autoplay muted loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div id="score-display" class="hud-text">СЧЕТ: 0</div>
    <div id="health-display" class="hud-text">ЗДОРОВЬЕ: 100</div>
    <div id="crosshair"></div>
    <div id="help-msg" class="hud-text">3D Танки Mobile</div>
  </div>

  <div id="joystick-zone"></div>
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
  <div id="look-zone"></div>

  <button id="btn-shoot">🔥</button>

  <div id="pc-hint">
    3D Танки Mobile
    <b>Кликните, чтобы начать</b>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    // ============================
    //  Глобальные переменные
    // ============================
    let scene, camera, renderer;
    let playerTank, playerVelocity = 0, playerRotation = 0;
    let turretAngle = 0, turretPitch = 0;
    const bullets = [];
    const enemies = [];
    let score = 0;
    let health = 100;

    // Управление
    const move = { x: 0, y: 0 };
    const keys = {};
    const shoot = { pressed: false, cooldown: 0 };
    let isPC = false;
    let pointerLocked = false;

    // Свайп-обзор (мобильный)
    let lookDragging = false, lookLastX = 0, lookLastY = 0;

    // Джойстик
    let joyActive = false, joyId = null;
    let joyCenterX = 0, joyCenterY = 0;
    const joyBase = document.getElementById('joystick-base');
    const joyKnob = document.getElementById('joystick-knob');
    const joyZone = document.getElementById('joystick-zone');

    // Респаун
    let spawnTimer = 0;
    const SPAWN_INTERVAL = 2500;
    let clock = new THREE.Clock();

    // ============================
    //  Инициализация
    // ============================
    function init() {
      isPC = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 60, 280);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(80, 160, 80);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x606060));

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      createCity();
      createPlayer();
      spawnEnemy();
      spawnEnemy();

      window.addEventListener('resize', onWindowResize);
      setupJoystick();
      setupLook();
      setupShootButton();
      setupKeyboard();
      setupMouse();

      if (isPC) {
        document.getElementById('pc-hint').style.display = 'block';
      }

      animate();
    }

    // ============================
    //  Город
    // ============================
    function createCity() {
      const groundGeo = new THREE.PlaneGeometry(400, 400);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x555544 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const boxGeo = new THREE.BoxGeometry(10, 20, 10);
      const matWall = new THREE.MeshStandardMaterial({ color: 0x888877 });
      for (let i = 0; i < 18; i++) {
        const box = new THREE.Mesh(boxGeo, matWall.clone());
        box.position.set((Math.random() - 0.5) * 220, 10, (Math.random() - 0.5) * 220);
        box.rotation.y = Math.random() * Math.PI;
        if (Math.random() > 0.4) {
          box.scale.y = 0.5 + Math.random() * 0.5;
          box.position.y = box.scale.y * 10;
        }
        scene.add(box);
      }

      const debrisGeo = new THREE.BoxGeometry(4, 4, 8);
      const debrisMat = new THREE.MeshStandardMaterial({ color: 0x776655 });
      for (let i = 0; i < 25; i++) {
        const d = new THREE.Mesh(debrisGeo, debrisMat.clone());
        d.position.set((Math.random() - 0.5) * 300, 2, (Math.random() - 0.5) * 300);
        d.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        scene.add(d);
      }

      const roadGeo = new THREE.PlaneGeometry(12, 400);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.y = 0.1;
      scene.add(road);
    }

    // ============================
    //  Игрок
    // ============================
    function createPlayer() {
      playerTank = new THREE.Group();

      const bodyGeo = new THREE.BoxGeometry(6, 3, 9);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.5;
      playerTank.add(body);

      const turretGeo = new THREE.CylinderGeometry(2.5, 2.5, 3, 12);
      const turretMat = new THREE.MeshStandardMaterial({ color: 0x1a9957 });
      const turret = new THREE.Mesh(turretGeo, turretMat);
      turret.position.y = 3.5;
      playerTank.add(turret);

      const barrelGeo = new THREE.BoxGeometry(0.4, 0.4, 5);
      const barrelMat = new THREE.MeshStandardMaterial({ color: 0x145a32 });
      const barrel = new THREE.Mesh(barrelGeo, barrelMat);
      barrel.position.set(0, 3.5, -3.5);
      playerTank.add(barrel);

      scene.add(playerTank);
    }

    // ============================
    //  Враги
    // ============================
    function spawnEnemy() {
      const alive = enemies.filter(e => e.userData.alive).length;
      if (alive >= 5) return;

      const enemy = new THREE.Group();

      // Корпус (нижняя часть)
      const eBodyGeo = new THREE.BoxGeometry(6, 3, 9);
      const eBodyMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
      const eBody = new THREE.Mesh(eBodyGeo, eBodyMat);
      eBody.position.y = 1.5;
      enemy.add(eBody);

      // Башня (верхняя часть) — отдельный меш для проверки попаданий
      const eTurretGeo = new THREE.CylinderGeometry(2.5, 2.5, 3, 12);
      const eTurretMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
      const eTurret = new THREE.Mesh(eTurretGeo, eTurretMat);
      eTurret.position.y = 3.5;
      eTurret.name = 'turret';
      enemy.add(eTurret);

      let x, z;
      do {
        x = (Math.random() - 0.5) * 250;
        z = (Math.random() - 0.5) * 250;
      } while (Math.hypot(x - playerTank.position.x, z - playerTank.position.z) < 50);

      enemy.position.set(x, 0, z);
      enemy.userData = { alive: true, speed: 0.06 + Math.random() * 0.04, fireCD: 2 + Math.random() * 2 };
      enemies.push(enemy);
      scene.add(enemy);
    }

    // ============================
    //  Стрельба игрока
    // ============================
    function shootBullet() {
      const bulletGeo = new THREE.SphereGeometry(0.35);
      const bulletMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff8800, emissiveIntensity: 0.6 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      // Направление с учётом поворота башни и наклона
      const aimDir = new THREE.Vector3(0, 0, -1);
      aimDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), turretAngle + playerRotation);
      aimDir.applyAxisAngle(new THREE.Vector3(1, 0, 0), turretPitch);

      const startPos = playerTank.position.clone();
      startPos.y += 3.5;
      startPos.add(aimDir.clone().multiplyScalar(4));
      bullet.position.copy(startPos);
      bullet.userData = { velocity: aimDir.clone().multiplyScalar(1.5), fromPlayer: true };

      bullets.push(bullet);
      scene.add(bullet);
    }

    // Стрельба врагов
    function enemyShoot(enemy) {
      const bulletGeo = new THREE.SphereGeometry(0.35);
      const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff0000, emissiveIntensity: 0.6 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      const dir = new THREE.Vector3().subVectors(playerTank.position, enemy.position).normalize();
      const startPos = enemy.position.clone();
      startPos.y += 3.5;
      startPos.add(dir.clone().multiplyScalar(4));
      bullet.position.copy(startPos);
      bullet.userData = { velocity: dir.multiplyScalar(0.9), fromPlayer: false };

      bullets.push(bullet);
      scene.add(bullet);
    }

    // ============================
    //  Обновление игрока
    // ============================
    function updatePlayer(dt) {
      const rotSpeed = 2.0;
      let throttle = 0, steer = 0;

      // Клавиатура (ПК)
      if (keys['KeyW'] || keys['ArrowUp'])    throttle += 1;
      if (keys['KeyS'] || keys['ArrowDown'])  throttle -= 1;
      if (keys['KeyA'] || keys['ArrowLeft'])  steer -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) steer += 1;

      // Джойстик (мобильный)
      if (joyActive) {
        throttle = -move.y;  // y отрицательный = вверх = вперёд
        steer = move.x;
      }

      // ИСПРАВЛЕНИЕ: знак минус — потому что в Three.js положительное
      // вращение по Y = против часовой = влево. Джойстик вправо (move.x > 0)
      // должен поворачивать вправо, значит вычитаем.
      playerRotation -= steer * rotSpeed * dt;
      playerTank.rotation.y = playerRotation;

      const maxFwd = 0.4, maxRev = -0.25;
      if (throttle > 0) playerVelocity = Math.min(playerVelocity + 0.5 * dt * throttle, maxFwd);
      else if (throttle < 0) playerVelocity = Math.max(playerVelocity + 0.5 * dt * throttle, maxRev);
      else playerVelocity *= 0.95;

      const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerRotation);
      playerTank.position.addScaledVector(dir, playerVelocity);

      playerTank.position.x = THREE.MathUtils.clamp(playerTank.position.x, -195, 195);
      playerTank.position.z = THREE.MathUtils.clamp(playerTank.position.z, -195, 195);

      // Камера от 1-го лица
      camera.position.set(playerTank.position.x, 3.5, playerTank.position.z);

      const lookDir = new THREE.Vector3(0, 0, -1);
      lookDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), turretAngle + playerRotation);
      lookDir.applyAxisAngle(new THREE.Vector3(1, 0, 0), turretPitch);
      camera.lookAt(camera.position.clone().add(lookDir));
    }

    // ============================
    //  Обновление врагов
    // ============================
    function updateEnemies(dt) {
      for (const e of enemies) {
        if (!e.userData.alive) continue;

        const dir = new THREE.Vector3().subVectors(playerTank.position, e.position);
        dir.y = 0;
        const dist = dir.length();
        dir.normalize();

        if (dist > 15) {
          e.position.addScaledVector(dir, e.userData.speed * 60 * dt);
        }

        const targetAngle = Math.atan2(dir.x, dir.z);
        e.rotation.y = targetAngle;

        e.userData.fireCD -= dt;
        if (e.userData.fireCD <= 0 && dist < 120) {
          enemyShoot(e);
          e.userData.fireCD = 2.5 + Math.random() * 2;
        }
      }
    }

    // ============================
    //  Обновление пуль + попадания
    // ============================
    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.addScaledVector(b.userData.velocity, 60 * dt);
        let remove = false;

        if (b.userData.fromPlayer) {
          // Пуля игрока → проверка попадания по врагам
          for (const enemy of enemies) {
            if (!enemy.userData.alive) continue;

            // Позиция башни врага в мировых координатах
            const turretWorldPos = new THREE.Vector3();
            // Башня — второй дочерний элемент (index 1), на y=3.5
            enemy.children[1].getWorldPosition(turretWorldPos);

            // Позиция корпуса врага
            const bodyWorldPos = enemy.position.clone();
            bodyWorldPos.y = 1.5;

            const distToTurret = b.position.distanceTo(turretWorldPos);
            const distToBody = b.position.distanceTo(bodyWorldPos);

            // Попадание в башню (радиус 3.0) — уничтожает врага
            if (distToTurret < 3.0) {
              enemy.userData.alive = false;
              scene.remove(enemy);
              score++;
              document.getElementById('score-display').innerText = 'СЧЕТ: ' + score;
              remove = true;
              break;
            }

            // Попадание в корпус (радиус 3.5) — не уничтожает, но пуля пропадает
            if (distToBody < 3.5) {
              remove = true;
              break;
            }
          }
        } else {
          // Пуля врага → попадание по игроку
          if (b.position.distanceTo(playerTank.position) < 4) {
            health -= 10;
            document.getElementById('health-display').innerText = 'ЗДОРОВЬЕ: ' + Math.max(0, health);
            remove = true;
            if (health <= 0) {
              health = 100;
              score = 0;
              document.getElementById('score-display').innerText = 'СЧЕТ: 0';
              document.getElementById('health-display').innerText = 'ЗДОРОВЬЕ: 100';
              playerTank.position.set(0, 0, 0);
              playerRotation = 0;
              playerVelocity = 0;
              turretAngle = 0;
              turretPitch = 0;
            }
          }
        }

        if (remove || b.position.distanceTo(playerTank.position) > 200) {
          scene.remove(b);
          bullets.splice(i, 1);
        }
      }
    }

    // ============================
    //  Респаун
    // ============================
    function updateSpawning(dt) {
      spawnTimer += dt * 1000;
      if (spawnTimer >= SPAWN_INTERVAL) {
        spawnTimer = 0;
        spawnEnemy();
      }
    }

    // ============================
    //  Джойстик
    // ============================
    function setupJoystick() {
      joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const t = e.changedTouches[0];
        joyActive = true;
        joyId = t.identifier;
        joyCenterX = t.clientX;
        joyCenterY = t.clientY;

        joyBase.style.display = 'block';
        joyKnob.style.display = 'block';
        joyBase.style.left = (joyCenterX - 60) + 'px';
        joyBase.style.top  = (joyCenterY - 60) + 'px';
        joyKnob.style.left = (joyCenterX - 28) + 'px';
        joyKnob.style.top  = (joyCenterY - 28) + 'px';
      }, { passive: false });

      joyZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        e.stopPropagation();
        for (const t of e.changedTouches) {
          if (t.identifier !== joyId) continue;
          const dx = t.clientX - joyCenterX;
          const dy = t.clientY - joyCenterY;
          const maxR = 50;
          const len = Math.hypot(dx, dy);
          const cl = len > maxR ? maxR / len : 1;
          const kx = dx * cl, ky = dy * cl;

          move.x = kx / maxR;
          move.y = ky / maxR;

          joyKnob.style.left = (joyCenterX + kx - 28) + 'px';
          joyKnob.style.top  = (joyCenterY + ky - 28) + 'px';
        }
      }, { passive: false });

      const joyEnd = (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier !== joyId) continue;
          joyActive = false;
          joyId = null;
          move.x = 0; move.y = 0;
          joyBase.style.display = 'none';
          joyKnob.style.display = 'none';
        }
      };
      joyZone.addEventListener('touchend', joyEnd);
      joyZone.addEventListener('touchcancel', joyEnd);
    }

    // ============================
    //  Обзор — мобильный
    // ============================
    function setupLook() {
      const lookZone = document.getElementById('look-zone');

      lookZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        lookDragging = true;
        const t = e.changedTouches[0];
        lookLastX = t.clientX;
        lookLastY = t.clientY;
      }, { passive: false });

      lookZone.addEventListener('touchmove', (e) => {
        if (!lookDragging) return;
        e.preventDefault();
        e.stopPropagation();
        const t = e.changedTouches[0];
        const dx = t.clientX - lookLastX;
        const dy = t.clientY - lookLastY;

        // ИСПРАВЛЕНИЕ: нормальная чувствительность и направление
        // Свайп вправо (dx > 0) → обзор вправо → turretAngle уменьшается
        // (потому что камера смотрит вдоль -Z, поворот вправо = отрицательный угол)
        turretAngle -= dx * 0.005;
        turretPitch = THREE.MathUtils.clamp(turretPitch - dy * 0.004, -0.6, 0.6);

        lookLastX = t.clientX;
        lookLastY = t.clientY;
      }, { passive: false });

      const lookEnd = (e) => {
        lookDragging = false;
      };
      lookZone.addEventListener('touchend', lookEnd);
      lookZone.addEventListener('touchcancel', lookEnd);
    }

    // ============================
    //  Кнопка стрельбы
    // ============================
    function setupShootButton() {
      const el = document.getElementById('btn-shoot');
      const on  = (e) => { e.preventDefault(); e.stopPropagation(); shoot.pressed = true; };
      const off = (e) => { e.preventDefault(); e.stopPropagation(); shoot.pressed = false; };
      el.addEventListener('touchstart', on, { passive: false });
      el.addEventListener('touchend', off);
      el.addEventListener('touchcancel', off);
      el.addEventListener('mousedown', on);
      el.addEventListener('mouseup', off);
      el.addEventListener('mouseleave', off);
    }

    // ============================
    //  Клавиатура (ПК)
    // ============================
    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space') { e.preventDefault(); shoot.pressed = true; }
      });
      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        if (e.code === 'Space') shoot.pressed = false;
      });
    }

    // ============================
    //  Мышь (ПК)
    // ============================
    function setupMouse() {
      const canvas = renderer.domElement;

      canvas.addEventListener('click', () => {
        if (isPC && !pointerLocked) {
          canvas.requestPointerLock();
        }
      });

      document.addEventListener('pointerlockchange', () => {
        pointerLocked = (document.pointerLockElement === canvas);
        if (pointerLocked) {
          document.getElementById('pc-hint').style.display = 'none';
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!pointerLocked) return;

        // ИСПРАВЛЕНИЕ: движение мыши вправо (movementX > 0) → обзор вправо
        // turretAngle уменьшается, потому что направление взгляда = turretAngle + playerRotation,
        // и положительный угол = поворот влево (против часовой в Three.js)
        turretAngle -= e.movementX * 0.003;
        turretPitch = THREE.MathUtils.clamp(turretPitch - e.movementY * 0.0025, -0.6, 0.6);
      });

      canvas.addEventListener('mousedown', (e) => {
        if (pointerLocked && e.button === 0) shoot.pressed = true;
      });
      canvas.addEventListener('mouseup', (e) => {
        if (e.button === 0) shoot.pressed = false;
      });
    }

    // ============================
    //  Ресайз
    // ============================
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ============================
    //  Главный цикл
    // ============================
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePlayer(dt);
      updateEnemies(dt);
      updateBullets(dt);
      updateSpawning(dt);

      shoot.cooldown -= dt;
      if (shoot.pressed && shoot.cooldown <= 0) {
        shootBullet();
        shoot.cooldown = 0.4;
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
